name: Release

# Pushing a version tag builds an update: `git tag v2.1.0 && git push origin v2.1.0`.
# The tag must match "version" in package.json, and CHANGELOG.md needs a "## 2.1.0" section (the release notes).
#
# Windows: the installer is always built here (windows-latest).
# Linux: the AppImage and the .deb are always built here (ubuntu-latest).
# macOS: the DMG is built here only when the repository variable MACOS_RELEASE is "true" (Settings › Secrets and
# variables › Actions › Variables) – macOS runners don't start for this repository at the moment.
#
# - DMG built here and SLS_RELEASE_KEY set: the release is published right away with the DMG, the Windows installer,
#   the AppImage, the .deb and one signed latest.json for all of them. Installed apps find it within a few hours.
# - Otherwise: a DRAFT release with the Windows installer and the Linux packages is created (installed apps don't see
#   drafts). Finish it on a Mac – see docs/DEVELOPMENT.md › "Releasing": build the DMG, download the installer and the
#   AppImage from the draft, run `npm run release` (signs one latest.json for all), upload DMG + latest.json to the
#   draft and publish it.
#
# One-time setup for the automatic route: Settings › Secrets and variables › Actions › New repository secret
#   SLS_RELEASE_KEY = the full contents of ~/.config/soullink-studio/release-key.pem
# (the private half of package.json → updates.publicKey; the apps only accept a feed signed with it).

on:
  push:
    tags: ['v*']

# Least privilege: the build jobs only read; only the publish job may create the release.
permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ctr:
    name: The 3DS part for Windows and Linux
    uses: ./.github/workflows/ctr.yml

  native:
    name: The fast player part for Windows and Linux
    uses: ./.github/workflows/native.yml

  windows:
    name: Build the Windows installer
    needs: [ctr, native]
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Tag matches package.json
        id: version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: node scripts/fetch-jre.mjs x64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ctr-win32-x64
          path: tools/ctr/win32-x64
      - run: node scripts/build-ctr.mjs --check
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: native-win32-x64
          path: tools/native/win32-x64
      - run: node scripts/build-native.mjs --check
      - name: Build the installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false' # unsigned (no certificate) – README explains SmartScreen
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Smoke test
        run: node scripts/smoke-app.mjs dist/win-unpacked/souldew.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows
          path: dist/souldew-${{ steps.version.outputs.version }}-win-x64-setup.exe
          if-no-files-found: error

  linux:
    name: Build the Linux AppImage and .deb
    needs: [ctr, native]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Virtual display for the smoke test; user namespaces for Chromium's sandbox (see linux.yml)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: node scripts/fetch-jre.mjs x64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ctr-linux-x64
          path: tools/ctr/linux-x64
      - run: chmod +x tools/ctr/linux-x64/ctrhost && node scripts/build-ctr.mjs --check
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: native-linux-x64
          path: tools/native/linux-x64
      - run: chmod +x tools/native/linux-x64/retrohost && node scripts/build-native.mjs --check
      - name: Build the AppImage and the .deb
        run: npx electron-builder --linux AppImage deb --x64 --publish never
      - name: Smoke test
        run: xvfb-run -a node scripts/smoke-app.mjs dist/linux-unpacked/souldew
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux
          path: |
            dist/souldew-*-linux-x86_64.AppImage
            dist/souldew-*-linux-amd64.deb
          if-no-files-found: error

  macos:
    name: Build the macOS DMG
    if: vars.MACOS_RELEASE == 'true'
    runs-on: macos-latest # Apple silicon – the app is built for arm64
    timeout-minutes: 120 # the 3DS core is built from source here
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: The 3DS part (host, Azahar core with the souldew patch, MoltenVK – npm run dist checks it)
        run: |
          brew install cmake ninja spirv-tools vulkan-headers git-lfs
          node scripts/build-ctr.mjs
      - name: The fast player part (host, melonDS DS, mGBA, Gambatte – npm run dist checks it)
        run: node scripts/build-native.mjs
      - name: Build the DMG
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false' # ad-hoc signed (build.mac.identity "-")
        run: npm run dist -- --publish never
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos
          path: dist/souldew-*-arm64.dmg
          if-no-files-found: error

  publish:
    name: Publish the GitHub release
    needs: [windows, linux, macos]
    # runs when Windows and Linux succeeded and macOS either succeeded or was skipped (not built here)
    if: always() && needs.windows.result == 'success' && needs.linux.result == 'success' && (needs.macos.result == 'success' || needs.macos.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release create
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Publish (DMG + installer + Linux packages + signed feed) or create a draft (without the DMG)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.windows.outputs.version }}
          RELEASE_KEY: ${{ secrets.SLS_RELEASE_KEY }}
        run: |
          ls -la dist
          dmg="dist/souldew-$VERSION-arm64.dmg"
          exe="dist/souldew-$VERSION-win-x64-setup.exe"
          appimage="dist/souldew-$VERSION-linux-x86_64.AppImage"
          deb="dist/souldew-$VERSION-linux-amd64.deb"
          if [ -f "$dmg" ] && [ -n "$RELEASE_KEY" ]; then
            key="$RUNNER_TEMP/release-key.pem"
            (umask 077 && printf '%s\n' "$RELEASE_KEY" > "$key")
            node scripts/release.mjs --key "$key" --dmg "$dmg" --win-exe "$exe" --appimage "$appimage" --deb "$deb"
            rm -f "$key"
            out="dist/release-$VERSION"
            # not a draft or pre-release: the apps read releases/latest/download/latest.json
            gh release create "v$VERSION" "$out/souldew-$VERSION-arm64.dmg" "$out/souldew-$VERSION-win-x64-setup.exe" \
              "$out/souldew-$VERSION-linux-x86_64.AppImage" "$out/souldew-$VERSION-linux-amd64.deb" "$out/latest.json" \
              --repo "$GITHUB_REPOSITORY" --title "souldew $VERSION" --notes-file "$out/notes.md" --verify-tag
            echo "Published v$VERSION with macOS + Windows + Linux and a signed latest.json." >> "$GITHUB_STEP_SUMMARY"
          else
            [ -f "$dmg" ] && echo "::warning::SLS_RELEASE_KEY is not set – the feed can't be signed, creating a draft instead"
            node --input-type=module -e "
              import { readFileSync, writeFileSync } from 'node:fs';
              const { changelogSection } = await import('./scripts/release.mjs');
              const notes = changelogSection(readFileSync('CHANGELOG.md', 'utf8'), process.env.VERSION);
              if (notes == null) { console.error('CHANGELOG.md has no ## ' + process.env.VERSION + ' section'); process.exit(1); }
              writeFileSync('notes.md', notes + '\n');"
            gh release create "v$VERSION" "$exe" "$appimage" "$deb" --draft --repo "$GITHUB_REPOSITORY" --title "souldew $VERSION" --notes-file notes.md --verify-tag
            {
              echo "### Draft release v$VERSION created (Windows installer + Linux packages)"
              echo "Installed apps don't see it yet. Finish it on a Mac (docs/DEVELOPMENT.md › Releasing):"
              echo '```'
              echo "npm run dist"
              echo "gh release download v$VERSION --pattern '*-win-x64-setup.exe' --pattern '*-linux-*' --dir dist"
              echo "npm run release"
              echo "gh release upload v$VERSION dist/release-$VERSION/souldew-$VERSION-arm64.dmg dist/release-$VERSION/latest.json"
              echo "gh release edit v$VERSION --draft=false --latest"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
