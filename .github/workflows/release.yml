name: Release

# Pushing a version tag publishes an update: `git tag v2.1.0 && git push origin v2.1.0`.
# The tag must match "version" in package.json, and CHANGELOG.md needs a "## 2.1.0" section (the release notes).
# Installed apps find the new version within a few hours (or at once via Settings › About › Check for updates).
#
# One-time setup: Settings › Secrets and variables › Actions › New repository secret
#   SLS_RELEASE_KEY = the full contents of ~/.config/soullink-studio/release-key.pem
# (the private half of package.json → updates.publicKey; the apps only accept a feed signed with it).

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build & publish the macOS app
    runs-on: macos-latest # Apple silicon – the app is built for arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Tag matches package.json
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - run: npm ci
      - run: npm run lint
      - run: npm test

      - name: Build the DMG
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false' # ad-hoc signed (build.mac.identity "-")
        run: npm run dist -- --publish never

      - name: Sign the update feed
        env:
          RELEASE_KEY: ${{ secrets.SLS_RELEASE_KEY }}
        run: |
          if [ -z "$RELEASE_KEY" ]; then
            echo "::error::The repository secret SLS_RELEASE_KEY is missing (see the top of this workflow)"
            exit 1
          fi
          key="$RUNNER_TEMP/release-key.pem"
          (umask 077 && printf '%s\n' "$RELEASE_KEY" > "$key")
          npm run release -- --key "$key"
          rm -f "$key"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          out="dist/release-$VERSION"
          # not a draft or pre-release: the apps read releases/latest/download/latest.json
          gh release create "v$VERSION" "$out/souldew-$VERSION-arm64.dmg" "$out/latest.json" \
            --repo "$GITHUB_REPOSITORY" --title "souldew $VERSION" --notes-file "$out/notes.md" --verify-tag
