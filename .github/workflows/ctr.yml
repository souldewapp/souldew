name: 3DS part (Windows, Linux)

# Builds souldew's Nintendo 3DS part – the native host (native/ctr-host) and Azahar's libretro core with
# native/azahar-patch – for Windows and Linux, as tools/ctr/<platform>/ artifacts the app packages bundle
# (release.yml, windows.yml and linux.yml call this workflow). macOS: `npm run ctr` on a Mac (docs/DEVELOPMENT.md).
# The core is built the way Azahar's own CI builds it (.github/workflows/libretro.yml in azahar-emu/azahar): Linux
# with gcc 12 on Ubuntu 22.04, Windows cross-compiled in libretro's MXE container.

on:
  workflow_call:
    inputs:
      platforms:
        description: 'linux, windows or both (comma-separated)'
        type: string
        default: 'linux,windows'
  workflow_dispatch:
    inputs:
      platforms:
        description: 'linux, windows or both (comma-separated)'
        type: string
        default: 'linux,windows'

permissions:
  contents: read

env:
  AZAHAR_TAG: '2126.2'

jobs:
  linux:
    name: 3DS part for Linux
    if: contains(inputs.platforms, 'linux')
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Cached build (same sources, same Azahar)
        id: cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: tools/ctr/linux-x64
          key: ctr-linux-x64-${{ env.AZAHAR_TAG }}-${{ hashFiles('native/**', 'scripts/build-ctr.mjs') }}
      - name: Tools
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends ninja-build gcc-12 g++-12 git-lfs
      - name: Azahar ${{ env.AZAHAR_TAG }}
        if: steps.cache.outputs.cache-hit != 'true'
        run: git clone --depth 1 --branch "$AZAHAR_TAG" --recurse-submodules --shallow-submodules https://github.com/azahar-emu/azahar.git "_ref/azahar-$AZAHAR_TAG"
      - name: Build the host and the core
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          CC: gcc-12
          CXX: g++-12
        run: |
          export CTR_VULKAN_INCLUDE="$PWD/_ref/azahar-$AZAHAR_TAG/externals/vulkan-headers/include"
          node scripts/build-ctr.mjs --azahar "$AZAHAR_TAG" --src "_ref/azahar-$AZAHAR_TAG"
          strip -s tools/ctr/linux-x64/azahar_libretro.so tools/ctr/linux-x64/ctrhost
      - run: node scripts/build-ctr.mjs --check
      - name: The host starts and loads the core
        run: |
          set +e
          tools/ctr/linux-x64/ctrhost; test $? -eq 2 # usage
          nm -D tools/ctr/linux-x64/azahar_libretro.so | grep -E ' T (retro_run|souldew_read_memory|souldew_title_id)$'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ctr-linux-x64
          path: tools/ctr/linux-x64/
          if-no-files-found: error

  windows:
    name: 3DS part for Windows
    if: contains(inputs.platforms, 'windows')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      IMAGE: reallibretroretroarch/libretro-build-mxe-win-cross-cores:mingw12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Cached build (same sources, same Azahar)
        id: cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: tools/ctr/win32-x64
          key: ctr-win32-x64-${{ env.AZAHAR_TAG }}-${{ hashFiles('native/**', 'scripts/build-ctr.mjs') }}
      - name: Tools
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends mingw-w64 git-lfs
      - name: Azahar ${{ env.AZAHAR_TAG }} with the souldew patch
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$AZAHAR_TAG" --recurse-submodules --shallow-submodules https://github.com/azahar-emu/azahar.git "_ref/azahar-$AZAHAR_TAG"
          git -C "_ref/azahar-$AZAHAR_TAG" apply "$PWD/native/azahar-patch/souldew-memory.patch"
      - name: Build the core (MXE cross container, as Azahar's CI)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          SRC="$PWD/_ref/azahar-$AZAHAR_TAG"
          docker pull "$IMAGE"
          docker run --rm --user root -v "$SRC:$SRC" -w "$SRC" "$IMAGE" bash -lc "\
            x86_64-w64-mingw32.static-cmake -DENABLE_LIBRETRO=ON -DENABLE_LTO=OFF -G Ninja . -B build/windows-x86_64 && \
            x86_64-w64-mingw32.static-cmake --build build/windows-x86_64 --target citra_libretro --config Release -j \$(nproc) && \
            x86_64-w64-mingw32.static-strip -s build/windows-x86_64/bin/Release/azahar_libretro.dll"
      - name: Build the host, put the part together
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          CC: x86_64-w64-mingw32-gcc
        run: |
          export CTR_VULKAN_INCLUDE="$PWD/_ref/azahar-$AZAHAR_TAG/externals/vulkan-headers/include"
          node scripts/build-ctr.mjs --platform win32-x64 --azahar "$AZAHAR_TAG" --core "_ref/azahar-$AZAHAR_TAG/build/windows-x86_64/bin/Release/azahar_libretro.dll"
          x86_64-w64-mingw32-strip -s tools/ctr/win32-x64/ctrhost.exe
      - name: Complete, the core exports the souldew calls
        run: |
          node scripts/build-ctr.mjs --platform win32-x64 --check
          sudo apt-get install -y --no-install-recommends binutils-mingw-w64-x86-64 >/dev/null 2>&1 || true
          x86_64-w64-mingw32-objdump -p tools/ctr/win32-x64/azahar_libretro.dll | grep -E 'souldew_read_memory|souldew_title_id'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ctr-win32-x64
          path: tools/ctr/win32-x64/
          if-no-files-found: error
