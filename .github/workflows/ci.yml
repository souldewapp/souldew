name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint & test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS runners never started for this repository (jobs cancelled after 15 min in the queue); the tests are
        # plain Node, so Linux and Windows cover them. Add macos-latest back once macOS runners are available.
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    env:
      # the tests don't need the Electron binary (≈100 MB per job)
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Translations complete
        shell: bash
        run: |
          node scripts/extract-i18n.mjs | tee i18n.txt
          # every language must report "0 missing, 0 stale", and en.json must already contain every string
          if grep -E ': [1-9][0-9]* missing|, [1-9][0-9]* stale' i18n.txt; then exit 1; fi
          git diff --exit-code -- web/i18n/en.json
