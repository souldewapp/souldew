<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>souldew player</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #game { position: absolute; inset: 0; }
  /* hide EmulatorJS chrome – the app draws its own console UI */
  .ejs_context_menu, .ejs_menu_bar, .ejs_virtualGamepad_parent, .ejs_message, .ejs_popup_container { display: none !important; }
  .ejs_canvas { image-rendering: pixelated; }
  /* the RetroArch core hides the cursor over the canvas (inline cursor:none) – keep it visible for DS touch */
  .ejs_canvas, .ejs_canvas_parent { cursor: default !important; }
  /* browsers keep audio – and with it the core – asleep until the first click into the frame */
  #tap { position: absolute; inset: 0; z-index: 50; display: grid; place-items: center; background: #000a; border: 0; cursor: pointer; font: 600 15px/1.3 system-ui, sans-serif; color: #ebe6da; }
  #tap span { padding: 10px 18px; border-radius: 999px; background: #18171cee; border: 1px solid #ffffff22; }
</style>
</head>
<body>
<div id="game"></div>
<script>
// Hosted inside the Play view (same origin). Boots EmulatorJS for one ROM and exposes a small
// control/memory API on window.__emu. The parent page drives it; nothing here talks to the network
// except fetching the ROM, the cores and the save file from the local server.
(function () {
  // The core asks for a screen wake lock, which Electron refuses (the app keeps the display awake itself while a game
  // runs, electron/main.mjs). Hand it a stand-in lock instead of an unhandled rejection in the console.
  if (navigator.wakeLock?.request) {
    const request = navigator.wakeLock.request.bind(navigator.wakeLock);
    navigator.wakeLock.request = (...args) => request(...args).catch(() => ({
      type: 'screen', released: false, onrelease: null, release: () => Promise.resolve(), addEventListener() {}, removeEventListener() {},
    }));
  }
  const q = new URLSearchParams(location.search);

  // ---- frame pacing (lib/pacer.mjs) -------------------------------------------------------------------
  // RetroArch's own timing sleeps on setTimeout, which a coarse system timer (Windows) stretches – fast-forward capped
  // near 2×, stalls at 1×. Its audio sync and fast-forward limit are off (raCfg below); the core's requests for its next
  // main-loop step land here and the pacer runs them from the display's frames. The module is loaded before EmulatorJS
  // (see the end of this script); anything asking before that waits in `early`.
  const RUNNER = 'MainLoop_runner'; // Emscripten's main-loop step (both its rAF and its setImmediate scheduler run it)
  const PACE_FPS = 60; // = lib/pacer.mjs PACE_FPS, the rate RetroArch makes its sound for (video_refresh_rate)
  let pacer = null;
  let fallback = false;
  const early = { step: null };
  const toPacer = (cb) => (pacer ? pacer.request(cb) : fallback ? nativeRaf(cb) : (early.step = cb));
  const nativeRaf = window.requestAnimationFrame.bind(window);
  window.requestAnimationFrame = function (cb) {
    if (cb?.name !== RUNNER) return nativeRaf(cb);
    toPacer(cb);
    return 0;
  };
  // Browsers have no setImmediate – Emscripten looks for one when the core switches to fast-forward. Anything else that
  // asks gets a real one (a message round trip).
  {
    const ch = new MessageChannel();
    const later = [];
    ch.port1.onmessage = () => later.shift()?.();
    window.setImmediate = function (cb, ...args) {
      if (cb?.name === RUNNER) return toPacer(cb), 0;
      later.push(() => cb(...args));
      ch.port2.postMessage(0);
      return 0;
    };
  }
  let fullTurbo = q.get('fullturbo') !== '0'; // Settings › "Full-power turbo" (play.mjs: ?fullturbo=0, __emu.setFullTurbo)
  const pacerReady = import('/lib/pacer.mjs').then(({ Pacer, soundRate }) => {
    // the sound's rate (see "audio_out_rate" below) – set before EmulatorJS starts and the core makes its AudioContext
    outRate = soundRate(deviceRate);
    ctxRate = outRate && outRate !== Math.round(deviceRate) ? outRate : 0;
    pacer = new Pacer({ fps: PACE_FPS });
    pacer.full = fullTurbo;
    if (early.step) pacer.request(early.step);
    // Full-power turbo (lib/pacer.mjs): the rest of a display frame's share runs in slices, each as a task of the lowest
    // priority – whatever the page has to do (input, the live reader, sync, the app's own updates) goes first, the
    // core takes what is left. No timer is involved. Measured with HeartGold at 4× on an M1: tasks of the app page waited
    // 13.6 ms (95th percentile) with "background" slices, 52 ms with plain message round trips (the fallback).
    const more = new MessageChannel();
    let queued = false;
    const slice = () => {
      queued = false;
      pacer.slice(performance.now());
      carryOn();
    };
    const carryOn = () => {
      if (queued || !pacer.pending(performance.now())) return;
      queued = true;
      if (globalThis.scheduler?.postTask) scheduler.postTask(slice, { priority: 'background' });
      else more.port2.postMessage(0);
    };
    more.port1.onmessage = slice;
    const tick = (now) => {
      nativeRaf(tick);
      pacer.tick(now);
      carryOn();
    };
    nativeRaf(tick);
    // No display frames (a hidden page, a minimised window): keep fast-forward going from a timer, as before.
    setInterval(() => {
      const now = performance.now();
      if (now - pacer.last > 120) {
        pacer.tick(now);
        carryOn();
      }
    }, 25);
  });

  const CORE ={ nds: 'melonds', gba: 'mgba', gbc: 'gambatte', gb: 'gambatte' };
  const system = q.get('system');
  window.EJS_player = '#game';
  window.EJS_pathtodata = '/vendor/emulatorjs/';
  window.EJS_core = q.get('core') || CORE[system] || system;
  window.EJS_gameUrl = q.get('rom');
  window.EJS_gameName = q.get('name') || 'game';
  window.EJS_startOnLoaded = true;
  window.EJS_CacheLimit = 0;            // don't keep a second copy of the ROM in IndexedDB
  window.EJS_disableLocalStorage = true; // our options win over settings remembered by EmulatorJS
  // Multi-threaded cores whenever the page may use threads (the server sends cross-origin isolation headers):
  // DeSmuME holds 3× exactly and 4× in nearly every scene with them. ?threads=0 forces the single-threaded core.
  window.EJS_threads = q.get('threads') !== '0' && !!self.crossOriginIsolated;
  window.EJS_language = 'en-US';
  window.EJS_disableAutoLang = true;
  window.EJS_volume = Number(q.get('volume') || 0.6);
  window.EJS_color = '#7f9ddb';
  window.EJS_backgroundColor = '#000';
  window.EJS_Buttons = {
    playPause: false, restart: false, mute: false, settings: false, fullscreen: false, saveState: false, loadState: false,
    screenRecord: false, gamepad: false, cheat: false, volume: false, saveSavFiles: false, loadSavFiles: false, quickSave: false,
    quickLoad: false, screenshot: false, cacheManager: false, exitEmulation: false, netplay: false, diskButton: false,
  };
  window.EJS_defaultOptions = {
    melonds_screen_layout: q.get('layout') || 'Top/Bottom',
    melonds_touch_mode: 'Touch', // click = tap at that spot (default "Mouse" moves a relative cursor)
    desmume_screens_layout: q.get('dlayout') || 'top/bottom',
    desmume_pointer_type: 'touch', // click = tap at that spot
    desmume_pointer_mouse: 'enabled',
    // Bus-level timing costs ~10–15 % CPU in WASM and HGSS/BW don't need it; frameskip starts at 0 and the
    // page raises it only when this computer can't hold 60 fps (see the speed check in play.mjs); fast-forward sets its
    // own (applySkip below).
    desmume_advanced_timing: 'disabled',
    lockMouse: 'disabled', // melonDS/DeSmuME report supportsMouse → EmulatorJS would pointer-lock on every click
    'save-save-interval': '15',
  };
  // No pointer lock at all in here (EmulatorJS' canvas click handler, RetroArch's mouse grab): the mouse must
  // stay free so a click outside the game works and DS touch uses absolute coordinates.
  Element.prototype.requestPointerLock = function () {};
  document.addEventListener('pointerlockchange', () => document.pointerLockElement && document.exitPointerLock());
  const E = () => window.EJS_emulator;
  const GM = () => E() && E().gameManager;

  // RetroArch settings EmulatorJS has no option for, appended to the retroarch.cfg it writes at boot. Fast-forward plays
  // the classic sound – the song at normal pitch in pieces, skipping ahead (RetroArch drops what doesn't fit) – and the
  // turbo mixer plays the music recorded at 1× over it (see TurboMixer.skip); frames fast-forward would throw away
  // aren't drawn (fastforward_frameskip – measured with mGBA: 56–60 pictures a second at 4× and at "Max", 750 frames).
  // Until 2.2 every core but DeSmuME played its sound sped up (audio_fastforward_speedup) and the mixer
  // slowed it back down. Paced from the display (below), that sound is no longer usable: RetroArch speeds each flush
  // up by the time between frames, and with several frames in one display frame it came out chopped (mGBA test tune,
  // 48 kHz: 2.2 ms pieces, 1.5 ms of zeros between them, 37 % of the sound) or at a pitch jumping between 1× and ~8×
  // (96 kHz) – slowed down, the turbo music sounded fast and garbled. Without the speed-up it is the clean song at
  // normal pitch at every speed, 4× and "Max" alike (measured at 48 and 96 kHz: no holes, every note at its pitch).
  const FF_SKIP = true;
  // Pacing (see "frame pacing" above): no audio sync and no fast-forward limit inside RetroArch – the pacer runs the
  // frames, RetroArch's rate control keeps the sound in step (later lines win over EmulatorJS' own). Its sound is made
  // at the rate of its AudioContext, so the browser doesn't resample each 2.9 ms OpenAL buffer on its own (44.1 kHz
  // buffers in a 48 kHz context – the usual case on Windows). That rate is the sound card's up to 48 kHz and 48 kHz
  // above it (lib/pacer.mjs soundRate – a card at 96 kHz doubled the mixer's work for nothing); the AudioContexts the
  // core makes get it below. 128 ms of buffer (EmulatorJS: 64) is RetroArch's own default for this OpenAL driver: half
  // of it is the cushion when the page is busy for a moment.
  const NativeAudioContext = window.AudioContext;
  const deviceRate = (() => {
    try {
      const ac = new NativeAudioContext();
      const r = ac.sampleRate;
      ac.close().catch(() => {});
      return r;
    } catch {
      return 0;
    }
  })();
  let outRate = 0; // soundRate(deviceRate), once lib/pacer.mjs is loaded (before EmulatorJS starts)
  let ctxRate = 0; // the rate asked of the core's AudioContexts (0: the card's own)
  if (NativeAudioContext) {
    window.AudioContext = function AudioContext(opts) {
      if (ctxRate && !opts?.sampleRate) {
        try {
          return new NativeAudioContext({ ...opts, sampleRate: ctxRate });
        } catch {
          ctxRate = 0; // refused: the card's own rate (the browser then resamples each OpenAL buffer, as before 2.2)
        }
      }
      return new NativeAudioContext(opts);
    };
    window.AudioContext.prototype = NativeAudioContext.prototype;
  }
  const AUDIO_LATENCY = 128;
  const raCfg = () => [
    `audio_fastforward_speedup = "${FF_SKIP ? 'false' : 'true'}"`,
    'fastforward_frameskip = "true"',
    'fastforward_ratio = "0.000000"',
    'audio_sync = "false"',
    'audio_rate_control = "true"',
    `audio_latency = "${AUDIO_LATENCY}"`,
    `video_refresh_rate = "${PACE_FPS}.000000"`,
    outRate ? `audio_out_rate = "${outRate}"` : '',
  ].filter(Boolean).join('\n') + '\n';
  let gmClass;
  Object.defineProperty(window, 'EJS_GameManager', {
    configurable: true,
    get: () => gmClass,
    set(C) {
      gmClass = C;
      const base = C?.prototype?.getRetroArchCfg;
      if (base && !base.patched) {
        // replace EmulatorJS' lines for the same keys: with a key twice in the file RetroArch keeps the first
        const key = (l) => l.split('=')[0].trim();
        C.prototype.getRetroArchCfg = function () {
          const cfg = raCfg();
          const ours = new Set(cfg.split('\n').map(key).filter(Boolean));
          return `${base.call(this).split('\n').filter((l) => !ours.has(key(l))).join('\n')}\n${cfg}`;
        };
        C.prototype.getRetroArchCfg.patched = true;
      }
    },
  });

  // Battery save from the app (?save=<url>) goes into the core's save folder before the ROM boots, so
  // the game starts with it like a real cartridge (loading it into a running core needs a reset).
  const SAVE_DIRS = { melonds: 'melonDS', mgba: 'mGBA', gambatte: 'Gambatte', desmume: 'DeSmuME', desmume2015: 'DeSmuME 2015' };
  const isDsv = () => /^desmume/.test(window.EJS_core);
  // DeSmuME keeps battery saves as .dsv: the raw data plus a footer naming the chip. The app always
  // stores the raw .sav, so convert on the way in and out.
  const DSV_TXT = new TextEncoder().encode('|<--Snip above here to create a raw sav by excluding this DeSmuME savedata footer:');
  const DSV_COOKIE = new TextEncoder().encode('|-DESMUME SAVE-|');
  const DSV_CHIPS = { 0x200: [1, 1], 0x2000: [2, 2], 0x8000: [4, 2], 0x10000: [3, 2], 0x40000: [5, 3], 0x80000: [6, 3], 0x100000: [7, 3] }; // size → [type, address bytes]
  // DeSmuME counts a save only up to the highest byte the game has written so far (a fresh HeartGold save: 256 KB + 1),
  // the cartridge chip is always one of the sizes above – the rest of it reads as erased flash (0xFF).
  const chipSize = (n) => Object.keys(DSV_CHIPS).map(Number).find((c) => c >= n) || n;
  function padChip(raw, size = chipSize(raw.length)) {
    if (raw.length >= size) return raw;
    const out = new Uint8Array(size).fill(0xff);
    out.set(raw);
    return out;
  }
  function toDsv(raw) {
    raw = padChip(raw);
    const [type, addr] = DSV_CHIPS[raw.length] || [0, 0];
    const out = new Uint8Array(raw.length + DSV_TXT.length + 24 + DSV_COOKIE.length);
    out.set(raw, 0);
    out.set(DSV_TXT, raw.length);
    const dv = new DataView(out.buffer);
    [raw.length, raw.length, type, addr, raw.length, 0].forEach((v, i) => dv.setUint32(raw.length + DSV_TXT.length + i * 4, v, true));
    out.set(DSV_COOKIE, out.length - DSV_COOKIE.length);
    return out;
  }
  function fromDsv(bytes) {
    const tail = bytes.length - DSV_COOKIE.length;
    // no footer = DeSmuME hasn't written a real save yet (fresh game) – there is nothing to keep
    if (tail < 24 || !DSV_COOKIE.every((b, i) => bytes[tail + i] === b)) return null;
    // footer: actual size, padded size, chip type, address bytes, chip size, version
    const dv = new DataView(bytes.buffer, bytes.byteOffset);
    const [size, pad, mem] = [0, 4, 16].map((o) => dv.getUint32(tail - 24 + o, true));
    const region = tail - 24 - DSV_TXT.length;
    const want = Math.max(size, pad, DSV_CHIPS[mem] ? mem : 0);
    return padChip(bytes.slice(0, Math.min(want, region)), chipSize(want));
  }
  const saveUrl = q.get('save');
  const savePromise = !saveUrl ? Promise.resolve(null) : fetch(saveUrl).then((r) => {
    if (r.status === 404) return null;
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return r.arrayBuffer().then((b) => new Uint8Array(b));
  });
  const romBase = new URL(window.EJS_gameUrl, location.href).pathname.split('/').pop().replace(/\.[^.]+$/, '');
  let bootSave = saveUrl ? 'pending' : 'none'; // → 'loaded' | 'none' | 'failed' | 'missed'
  let bootSavePath = null;
  // Runs right before EmulatorJS fetches the ROM, i.e. after its file system exists and before the core starts.
  // Hooked on the class itself as soon as emulator.min.js defines it: the 'ready' event can fire too late when
  // the core comes from the browser cache.
  let EJSClass;
  Object.defineProperty(window, 'EmulatorJS', {
    configurable: true,
    get: () => EJSClass,
    set(cls) {
      EJSClass = cls;
      const downloadRom = cls.prototype.downloadRom;
      cls.prototype.downloadRom = async function () {
        await beforeRom(this.gameManager);
        return downloadRom.call(this);
      };
      // Offline only: no version check against cdn.emulatorjs.org (it runs on every localhost page) and no
      // "core missing locally → fetch it from the CDN" fallback. The page's CSP blocks both anyway.
      cls.prototype.checkForUpdates = function () {};
      const downloadFile = cls.prototype.downloadFile;
      cls.prototype.downloadFile = function (path, ...rest) {
        try {
          if (typeof path === 'string' && /^https?:/i.test(path) && new URL(path).origin !== location.origin) return Promise.resolve(-1);
        } catch (err) { /* not a URL – local path */ }
        return downloadFile.call(this, path, ...rest);
      };
    },
  });
  async function beforeRom(gm) {
    // RetroArch draws its own notices ("Fast-Forward.", "Saved state …") into the picture – the app shows
    // its own. The config is read when the core starts, right after this.
    try {
      const cfg = '/home/web_user/.config/retroarch/retroarch.cfg';
      const text = new TextDecoder().decode(gm.FS.readFile(cfg));
      gm.FS.writeFile(cfg, `${text}video_font_enable = "false"\nmenu_enable_widgets = "false"\nnotification_show_fast_forward = "false"\n`);
    } catch (err) {
      console.warn('retroarch.cfg not patched', err);
    }
    try {
      const bytes = await savePromise;
      const dir = `/data/saves/${SAVE_DIRS[window.EJS_core] || window.EJS_core}`;
      bootSavePath = `${dir}/${romBase}.${isDsv() ? 'dsv' : 'sav'}`;
      if (bytes?.length) {
        try { gm.FS.mkdirTree ? gm.FS.mkdirTree(dir) : gm.FS.mkdir(dir); } catch (err) { /* exists */ }
        gm.FS.writeFile(bootSavePath, isDsv() ? toDsv(bytes) : bytes);
        bootSave = 'loaded';
      } else if (saveUrl) {
        // no save on disk → don't boot with a stale copy EmulatorJS kept in IndexedDB
        try { gm.FS.unlink(bootSavePath); } catch (err) { /* none */ }
        bootSave = 'none';
      }
    } catch (err) {
      console.warn('save preload failed', err);
      bootSave = 'failed';
    }
  }
  const heap = () => GM().Module.HEAPU8;

  function indexOfBytes(hay, needle, from = 0) {
    const n0 = needle[0];
    const nl = needle.length;
    const end = hay.length - nl;
    for (let i = hay.indexOf(n0, from); i !== -1 && i <= end; i = hay.indexOf(n0, i + 1)) {
      let k = 1;
      while (k < nl && hay[i + k] === needle[k]) k++;
      if (k === nl) return i;
    }
    return -1;
  }
  function findAll(needle, max = 64, hay = heap()) {
    const out = [];
    for (let p = indexOfBytes(hay, needle); p !== -1 && out.length < max; p = indexOfBytes(hay, needle, p + 1)) out.push(p);
    return out;
  }

  // ---- locating emulated RAM inside the WASM heap ----------------------------------------
  const ram = { base: -1, size: 0, system: null, tried: 0 };
  let ndsHeader = null; // first 0x20 bytes of the ROM – read out of MEMFS once, not on every attempt
  function locateNds() {
    // The cartridge header is copied to main RAM at 0x027FFA80 and 0x027FFE00 after boot;
    // requiring both copies (0x380 apart) rules out the ROM buffer and other header copies.
    if (!ndsHeader) ndsHeader = GM().FS.readFile('/' + E().fileName).slice(0, 0x20);
    const hdr = ndsHeader;
    const hits = findAll(hdr);
    for (const p of hits) if (p >= 0x3ffe00 && hits.includes(p - 0x380)) return { base: p - 0x3ffe00, size: 0x400000 };
    return null;
  }
  function stateRamSpec(st) {
    const c = E().getCore();
    const sys = E().getCore(true);
    if (c === 'mgba' && sys === 'gba') return { off: 16 + 0x21000, len: 0x40000, size: 0x48000 };
    if (c === 'mgba') return { off: 16 + 0x4400, len: 0x8000, size: 0x8000 };
    if (c === 'gambatte') {
      const p = indexOfBytes(st, new TextEncoder().encode('wram\0'));
      if (p < 0) return null;
      const len = (st[p + 5] << 16) | (st[p + 6] << 8) | st[p + 7];
      return { off: p + 8, len, size: len };
    }
    return null;
  }
  function locateFromState() {
    const st = GM().getState();
    const spec = stateRamSpec(st);
    if (!spec) return null;
    const region = st.subarray(spec.off, spec.off + spec.len);
    const h = heap();
    for (let off = 0; off + 64 <= region.length; off += 256) {
      const chunk = region.subarray(off, off + 64);
      if (new Set(chunk).size < 12) continue;
      for (const hit of findAll(chunk, 8, h)) {
        const base = hit - off;
        let same = true;
        for (let i = 0; same && i < region.length; i += 1) same = h[base + i] === region[i];
        if (same) return { base, size: spec.size };
      }
    }
    return null;
  }
  function locateRam() {
    const was = E().paused;
    if (!was) E().pause(true);
    let r = null;
    try {
      r = E().getCore(true) === 'nds' ? locateNds() : locateFromState();
    } catch (e) {
      r = null;
    } finally {
      if (!was) E().play(true);
    }
    ram.tried++;
    if (r) Object.assign(ram, r, { system: E().getCore(true) });
    return r;
  }
  function toOff(a) {
    if (ram.system === 'nds') return (a - 0x02000000) & 0x3fffff;
    if (ram.system === 'gba') return (a >>> 24) === 3 ? 0x40000 + (a & 0x7fff) : a & 0x3ffff;
    // GB/GBC WRAM: 0xC000–0xCFFF bank 0, 0xD000–0xDFFF bank 1 (Pokémon never switches banks for party data)
    return a >= 0xc000 && a < 0xe000 ? a - 0xc000 : -1;
  }
  /** Read `len` bytes at a console bus address. Returns a copy (safe across heap growth). */
  function read(addr, len) {
    if (ram.base < 0) return null;
    const o = toOff(addr);
    if (o < 0 || o + len > ram.size) return null;
    return heap().slice(ram.base + o, ram.base + o + len);
  }
  /**
   * Write bytes at a console bus address (cheats: shared/live/cheats.mjs checks the place first). The core runs on
   * this thread between animation frames, so a write made in one go lands between two frames like the game's own.
   */
  function write(addr, bytes) {
    // (the bytes come from the app page – another realm, so `instanceof Uint8Array` would say no)
    if (ram.base < 0 || !ArrayBuffer.isView(bytes)) return false;
    const o = toOff(addr);
    if (o < 0 || o + bytes.length > ram.size) return false;
    heap().set(bytes, ram.base + o);
    return true;
  }

  // ---- picture for the partner's mini view ("partner screen") -----------------------------
  const gameCanvas = () => E()?.canvas || document.querySelector('#game canvas') || null;
  // The game area inside the canvas: RetroArch letterboxes the picture into the element. The play view
  // already sizes the iframe to the console's aspect, so this only trims bars (e.g. in fullscreen).
  let sideBySide = /left/i.test(q.get('layout') || ''); // DS screens next to each other (switchable while playing)
  const GAME_AR = { gba: 3 / 2, gbc: 10 / 9, gb: 10 / 9 };
  function gameRect(c) {
    const ar = system === 'nds' ? (sideBySide ? 512 / 192 : 256 / 384) : GAME_AR[system];
    let x = 0, y = 0, w = c.width, h = c.height;
    if (ar && w && h) {
      if (w / h > ar * 1.02) { const nw = h * ar; x = (w - nw) / 2; w = nw; }
      else if (w / h < ar / 1.02) { const nh = w / ar; y = (h - nh) / 2; h = nh; }
    }
    return { x, y, w, h };
  }
  // WebGL canvases without preserveDrawingBuffer read back empty outside the frame that drew them.
  // A rAF callback queued from outside a frame runs after EmulatorJS' own one in the same frame, so the
  // buffer is still intact there. If that still reads black we fall back to RetroArch's own screenshot
  // (PNG of the core framebuffer, a bit more CPU) and stick with it once it proves to work.
  let shotMode = 'canvas'; // → 'core'
  let canvasBlack = 0;
  let shot = null;
  const shotCtx = (w, h) => {
    if (!shot) {
      shot = typeof OffscreenCanvas !== 'undefined' ? new OffscreenCanvas(w, h) : Object.assign(document.createElement('canvas'), { width: w, height: h });

      try { return c?.captureStream ? c.captureStream(fps) : null; } catch (e) { return null; }
    },
    /** Small still picture (Blob) for the partner's mini view: snapshot({ maxW, type, quality }). */
    snapshot,
    // Flush the core's SRAM to MEMFS and read it. Deliberately not GM().getSaveFile()/saveSaveFiles():
    // those fire EmulatorJS' 'saveSaveFiles' event, which we report to the app as "the game saved"
    // → the app flushes again → endless loop.
    getSave() {
      GM().functions.saveSaveFiles();
      const bytes = GM().getSaveFile(false);
      return bytes && isDsv() ? fromDsv(bytes) : bytes;
    },
    /** How the app's save reached the core at boot: 'loaded' | 'none' | 'failed' | 'missed' | 'pending'. */
    bootSave: () => bootSave,
    loadSave(bytes) {
      const path = GM().getSaveFilePath();
      const dir = path.slice(0, path.lastIndexOf('/'));
      try { GM().FS.mkdirTree ? GM().FS.mkdirTree(dir) : GM().FS.mkdir(dir); } catch (e) { /* exists */ }
      GM().FS.writeFile(path, isDsv() ? toDsv(bytes) : bytes);
      GM().loadSaveFiles();
      cutAudio();
      GM().restart();
    },
    setVolume(v) {
      audio.volume = v;
      refreshGates();
      if (audio.vol) audio.vol.gain.setTargetAtTime(v, audio.vol.context.currentTime, 0.015);
      else {
        E().volume = v;
        E().setVolume(v);
      }
    },
    muted: () => audio.volume === 0,
    /**
     * What happens to the sound while fast-forwarding: 'music' (the song at normal speed – synthesized from the ROM or
     * recorded at 1×) | 'mute' | 'original' | 'plain' (the sped-up original without the mixer – no extra audio work).
     */
    setTurboAudio(mode) {
      audio.mode = mode;
      routeAudio();
      tellAudio({ type: 'mode', mode: mixerMode() });
      tellAudio({ type: 'paused', paused: mixerPaused() });
    },
    /** The music the game plays now (location.mjs musicKey; null = unknown): the turbo mixer follows it. */
    songKey(key) {
      if (!key || key === audio.key) return;
      audio.key = key;
      tellAudio({ type: 'song', key });
      sdatSong(key);
    },
    /** Every mixer event from now on (the page keeps them for "Save diagnostics"); returns the unsubscribe. */
    onAudio(f) {
      audio.subs.add(f);
      return () => audio.subs.delete(f);
    },
    /** Turbo audio state for checks from the console: how it is attached and the last search / switch. */
    /** The nodes that feed the speakers (the gates and the volume) – for level checks. */
    speakerNodes: () => [...gates, audio.vol].filter(Boolean),
    turboAudio: () => ({ attached: audio.kind, current: !!audio.al && audio.al === GM()?.Module?.AL?.currentCtx, gates: [...gates].map((g) => +g.gain.value.toFixed(3)), gate: gateLevel(), once: !!audio.attachedOnce, failed: audio.failed, mode: audio.mode, speed: audio.speed, paused: audio.paused, volume: audio.volume, key: audio.key, sampleRate: audio.al?.audioCtx.sampleRate, mixers: audio.chains?.counts() ?? null, ...audio.info, log: audio.log.slice() }),
    /** Timing and sound facts for "Save diagnostics": the sound card, the pacing, the last measuring window, totals. */
    perf() {
      const ac = GM()?.Module?.AL?.currentCtx?.audioCtx;
      return {
        sound: {
          contextRate: ac?.sampleRate ?? null,
          state: ac?.state ?? null,
          baseLatencyMs: ac?.baseLatency != null ? +(ac.baseLatency * 1000).toFixed(1) : null,
          outputLatencyMs: ac?.outputLatency != null ? +(ac.outputLatency * 1000).toFixed(1) : null,
          coreOutRate: outRate || 44100, // what RetroArch was told to make
          deviceRate: Math.round(deviceRate) || null, // the sound card's own rate (the context runs at ≤ 48 kHz)
          ffSound: FF_SKIP ? 'normal pitch' : 'sped up',
          bufferMs: AUDIO_LATENCY,
          mixer: audio.kind || (audio.failed ? 'failed' : null),
          mixers: audio.chains?.counts() ?? null, // live (1 once attached), built in all, contexts the core left behind and closed here
          mode: audio.mode,
        },
        pacing: { fps: PACE_FPS, displayHz: pacer?.disp ? +(1000 / pacer.disp).toFixed(1) : null, speed: speed === Infinity ? 'max' : speed, fullTurbo, threads: !!window.EJS_threads, core: window.EJS_core },
        last: perfLog.last,
        totals: { underruns: sound.underruns, ffHoles: sound.ffHoles, longTasks: sound.longTasks },
      };
    },
    setOption(k, v) {
      if (k === 'desmume_frameskip') {
        skip1x = String(v); // the page's choice for 1× – fast-forward picks its own (applySkip)
        return applySkip();
      }
      if (/screens?_layout$/.test(k)) sideBySide = /left/i.test(v);
      E().menuOptionChanged(k, v);
    },
    fullscreen: () => document.documentElement.requestFullscreen?.(),
  };

  // Chrome suspends the core's AudioContext until the user interacts with this frame; the core then waits
  // on its audio and the picture stands still. Offer one click to start (not needed in the desktop app).
  function wakeAudio() {
    const ctx = GM()?.Module?.AL?.currentCtx?.audioCtx;
    if (!ctx || ctx.state !== 'suspended') return;
    const tap = document.createElement('button');
    tap.id = 'tap';
    tap.innerHTML = `<span>▶ ${(q.get('tap') || 'Click to start').replace(/[<&>]/g, '')}</span>`;
    const go = () => {
      ctx.resume().catch(() => {});
      tap.remove();
      removeEventListener('keydown', go, true);
    };
    tap.addEventListener('click', go);
    addEventListener('keydown', go, true);
    document.body.appendChild(tap);
  }
  window.EJS_onGameStart = () => {
    setTimeout(wakeAudio, 400);
    syncAudio();
    setInterval(syncAudio, 250);
    // the core looked somewhere else for its save → let the app fall back to loadSave()
    if (bootSave === 'loaded' && GM().getSaveFilePath() !== bootSavePath) bootSave = 'missed';
    window.__emu.ready = true;
    // Only the 12 game buttons stay bound (EJS_defaultControls below). EmulatorJS' own extras – L2/R2 on Tab/R,
    // sticks on T/F/G/H…, hotkeys 24–29 on 1/2/3 – would collide with the app's shortcuts, so drop them for good.
    try {
      for (const set of [E().controls, E().defaultControllers]) {
        for (const p of Object.values(set || {})) if (p) for (const n of Object.keys(p)) if (Number(n) >= 12) delete p[n];
      }
      E().enableMouseLock = false;
    } catch (e) { /* older API */ }
    // EmulatorJS flushed the battery save on its own (periodic 'save-save-interval' or on exit) →
    // let the app write it to disk right away. Our own __emu.getSave() doesn't fire this event.
    try { E().on('saveSaveFiles', () => window.parent?.postMessage({ type: 'emu-saved' }, location.origin)); } catch (e) { /* older API */ }
    window.parent?.postMessage({ type: 'emu-started', core: E().getCore(), system: E().getCore(true) }, location.origin);
  };
  const forwardKey = (e, down) => window.parent?.postMessage({
    type: 'emu-key', key: e.key, code: e.code, shift: e.shiftKey, ctrl: e.ctrlKey, alt: e.altKey, meta: e.metaKey, down, repeat: e.repeat,
  }, location.origin);
  window.addEventListener('keydown', (e) => forwardKey(e, true));
  window.addEventListener('keyup', (e) => forwardKey(e, false));
  // Focus left the game while keys were held (alt-tab, a click outside): the keyups never come. End the turbo and
  // let go of every game button – otherwise the player keeps walking in one direction when they come back.
  let release = () => {};
  window.addEventListener('blur', () => {
    forwardKey({ key: 'Tab', code: 'Tab' }, false);
    release();
  });

  // Controllers beyond what EmulatorJS does itself: the left stick works as the D-pad, ZR/RT/R2 toggles turbo,
  // ZL/LT/L2 and the Home/PS/Guide button pause – those go to the page like the keyboard shortcuts.
  function startPads(c) {
    const idx = Object.fromEntries(c.BUTTONS.map((b) => [b.id, b.ejs]));
    const stick = { up: false, down: false, left: false, right: false };
    const held = {};
    const set = (dir, on) => {
      if (stick[dir] === on) return;
      stick[dir] = on;
      try { GM()?.simulateInput(0, idx[dir], on ? 1 : 0); } catch { /* core not ready */ }
    };
    release = () => {
      for (const b of c.BUTTONS) try { GM()?.simulateInput(0, b.ejs, 0); } catch { /* core not ready */ }
      for (const d of Object.keys(stick)) stick[d] = false;
    };
    const HOT = { 7: 'turbo', 6: 'pause', 16: 'pause' };
    setInterval(() => {
      if (!window.__emu?.ready || document.visibilityState === 'hidden') return;
      const pad = [...(navigator.getGamepads?.() || [])].find((g) => g && g.connected);
      if (!pad) return;
      const [x = 0, y = 0] = pad.axes;
      set('left', x < -0.5);
      set('right', x > 0.5);
      set('up', y < -0.5);
      set('down', y > 0.5);
      for (const [i, action] of Object.entries(HOT)) {
        const on = !!pad.buttons[i]?.pressed;
        if (on && !held[i]) window.parent?.postMessage({ type: 'emu-pad', action }, location.origin);
        held[i] = on;
      }
    }, 16);
  }
  // Key mapping from Settings › Controls (config.controls) – read once before EmulatorJS boots.
  Promise.all([import('/lib/controls.mjs'), fetch('/api/status').then((r) => r.json()).catch(() => null)])
    .then(async ([c, st]) => {
      await c.detectLayout(st?.config?.lang); // keyCodes follow the printed letters (QWERTZ, AZERTY …)
      window.EJS_defaultControls = c.ejsControls(st?.config?.controls, undefined, st?.config?.pads);
      startPads(c);
    })
    .catch((e) => console.warn('controls not applied', e))
    .then(() => pacerReady)
    .catch((e) => {
      // (can't happen short of a broken install) – the display's frames drive the core directly then
      console.warn('frame pacer not loaded', e);
      fallback = true;
      if (early.step) nativeRaf(early.step);
    })
    .finally(() => {
      const s = document.createElement('script');
      s.src = '/vendor/emulatorjs/loader.js';
      document.body.appendChild(s);
    });
})();
</script>
</body>
</html>
