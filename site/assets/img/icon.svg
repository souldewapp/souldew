<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- souldew: a handheld whose screen shows the two linked rings (player 1 blue, player 2 pink).
       macOS icon grid: the body fills the 824 px squircle, no outline – high contrast on light and dark docks. -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e2c38"/><stop offset=".55" stop-color="#17161d"/><stop offset="1" stop-color="#0a090d"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".22"/><stop offset=".12" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="lcd" cx=".5" cy=".42" r=".75">
      <stop offset="0" stop-color="#22362a"/><stop offset=".7" stop-color="#101a14"/><stop offset="1" stop-color="#070b08"/>
    </radialGradient>
    <filter id="glow" filterUnits="userSpaceOnUse" x="204" y="208" width="616" height="436"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="190" fill="url(#body)"/>
  <rect x="100" y="100" width="824" height="824" rx="190" fill="url(#rim)"/>
  <!-- screen -->
  <rect x="172" y="176" width="680" height="500" rx="56" fill="#050407"/>
  <rect x="204" y="208" width="616" height="436" rx="30" fill="url(#lcd)"/>
  <g filter="url(#glow)" opacity=".9"><g transform="translate(272 312) scale(15)">
    <path fill="#6f9bff" d="M4 2h6v2H4zM2 4h2v8H2zM10 4h2v2h-2zM10 10h2v2h-2zM4 12h6v2H4z"/>
    <path fill="#ff74d4" d="M22 2h6v2h-6zM28 4h2v8h-2zM20 4h2v2h-2zM20 10h2v2h-2zM22 12h6v2h-6z"/>
    <path fill="#eaffc9" d="M12 6h8v4h-8z"/>
  </g></g>
  <g shape-rendering="crispEdges" transform="translate(272 312) scale(15)">
    <path fill="#8cb0ff" d="M4 2h6v2H4zM2 4h2v8H2zM10 4h2v2h-2zM10 10h2v2h-2zM4 12h6v2H4z"/>
    <path fill="#ff8fdc" d="M22 2h6v2h-6zM28 4h2v8h-2zM20 4h2v2h-2zM20 10h2v2h-2zM22 12h6v2h-6z"/>
    <path fill="#f2ffdc" d="M12 6h8v4h-8z"/>
  </g>
  <!-- scanline sheen -->
  <rect x="204" y="208" width="616" height="120" rx="30" fill="#ffffff" opacity=".035"/>
  <!-- controls -->
  <circle cx="218" cy="722" r="13" fill="#ff4a3d"/>
  <circle cx="218" cy="722" r="26" fill="#ff4a3d" opacity=".35" filter="url(#soft)"/>
  <g fill="#050407">
    <rect x="296" y="752" width="44" height="132" rx="10"/>
    <rect x="252" y="796" width="132" height="44" rx="10"/>
  </g>
  <circle cx="706" cy="830" r="46" fill="#3a1d2e"/>
  <circle cx="804" cy="778" r="46" fill="#1d2a45"/>
  <circle cx="706" cy="822" r="46" fill="#ff74d4" opacity=".55"/>
  <circle cx="804" cy="770" r="46" fill="#6f9bff" opacity=".55"/>
</svg>
