<!doctype html>
<!-- Source of the DMG window background (build/background.png + @2x). Render it again after a change:
     node scripts/render-dmg-background.mjs
     Layout matches package.json build.dmg: window 660×420, the app icon at (180, 214), Applications at (480, 214). -->
<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: 'Pixelify Sans'; font-weight: 700; src: url('../web/assets/fonts/PixelifySans-700-latin.woff2') format('woff2'); }
  @font-face { font-family: 'Pixelify Sans'; font-weight: 500; src: url('../web/assets/fonts/PixelifySans-500-latin.woff2') format('woff2'); }
  @font-face { font-family: 'IBM Plex Sans'; font-weight: 500; src: url('../web/assets/fonts/IBMPlexSans-500-latin.woff2') format('woff2'); }
  html, body { margin: 0; width: 660px; height: 420px; overflow: hidden; }
  body { position: relative; background:
    radial-gradient(520px 300px at 50% 0%, #2c2a36 0%, transparent 70%),
    linear-gradient(180deg, #1e1d24 0%, #17161c 55%, #0f0e13 100%); }
  /* faint LCD scanlines over everything */
  body::after { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(0deg, #ffffff05 0 1px, transparent 1px 3px); pointer-events: none; }
  .mark { position: absolute; top: 34px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 14px; }
  .mark svg { width: 46px; height: 23px; filter: drop-shadow(0 0 6px #8cb0ff88) drop-shadow(0 0 10px #ff8fdc55); }
  .word { font-family: 'Pixelify Sans'; font-weight: 700; font-size: 40px; letter-spacing: 0.03em; color: #e9f2d6; text-shadow: 3px 3px 0 #2c3a2c; }
  .tag { position: absolute; top: 92px; left: 0; right: 0; text-align: center; font-family: 'IBM Plex Sans'; font-weight: 500; font-size: 13px; color: #8f8c99; letter-spacing: 0.02em; }
  /* soft wells under both icons, so they sit on something */
  .well { position: absolute; top: 152px; width: 132px; height: 132px; border-radius: 28px; background: radial-gradient(circle at 50% 40%, #2d2b37, #1a1920 70%); box-shadow: inset 0 1px 0 #ffffff12, inset 0 -10px 24px #0007, 0 12px 30px #0008; }
  .well.app { left: 114px; }
  .well.apps { left: 414px; }
  /* pixel arrow: blue → pink, like player 1 → player 2 */
  .arrow { position: absolute; top: 202px; left: 262px; width: 136px; height: 24px; }
  .hint { position: absolute; bottom: 30px; left: 0; right: 0; text-align: center; font-family: 'IBM Plex Sans'; font-weight: 500; font-size: 15px; color: #c9c5d3; letter-spacing: 0.01em; }
  .hint b { color: #e9f2d6; font-weight: 500; }
</style>
</head>
<body>
  <div class="mark">
    <svg viewBox="0 0 32 16" shape-rendering="crispEdges" aria-hidden="true">
      <path fill="#8cb0ff" d="M4 2h6v2H4zM2 4h2v8H2zM10 4h2v2h-2zM10 10h2v2h-2zM4 12h6v2H4z" />
      <path fill="#ff8fdc" d="M22 2h6v2h-6zM28 4h2v8h-2zM20 4h2v2h-2zM20 10h2v2h-2zM22 12h6v2h-6z" />
      <path fill="#f2ffdc" d="M12 6h8v4h-8z" />
    </svg>
    <span class="word">souldew</span>
  </div>
  <div class="tag">SoulLinks &amp; Nuzlockes · live getrackt</div>
  <div class="well app"></div>
  <div class="well apps"></div>
  <svg class="arrow" viewBox="0 0 62 12" shape-rendering="crispEdges" aria-hidden="true">
    <defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#8cb0ff" /><stop offset="1" stop-color="#ff8fdc" /></linearGradient>
      <filter id="glow" x="-20%" y="-80%" width="140%" height="260%"><feGaussianBlur stdDeviation="1.4" /></filter></defs>
    <g fill="url(#g)">
      <g filter="url(#glow)" opacity=".7"><path d="M0 5h4v2H0zM8 5h4v2H8zM16 5h4v2h-4zM24 5h4v2h-4zM32 5h4v2h-4zM40 5h4v2h-4zM46 5h6v2h-6zM52 1h2v10h-2zM54 2h2v8h-2zM56 3h2v6h-2zM58 4h2v4h-2zM60 5h2v2h-2z" /></g>
      <path d="M0 5h4v2H0zM8 5h4v2H8zM16 5h4v2h-4zM24 5h4v2h-4zM32 5h4v2h-4zM40 5h4v2h-4zM46 5h6v2h-6zM52 1h2v10h-2zM54 2h2v8h-2zM56 3h2v6h-2zM58 4h2v4h-2zM60 5h2v2h-2z" />
    </g>
  </svg>
  <div class="hint">Zieh <b>souldew</b> in deine Programme</div>
</body>
</html>
